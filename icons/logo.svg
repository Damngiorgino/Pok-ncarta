<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs><clipPath id="cv"><rect x="12" y="4" width="43" height="44" rx="4"/></clipPath></defs>
  <!-- alone crema: resta leggibile anche sulle barre scure -->
  <rect x="8.5" y=".5" width="50" height="63" rx="7" fill="#fbf8f2"/>
  <!-- blocco delle pagine -->
  <path d="M17 42 H55 V59 H17 a5 5 0 0 1 -5 -5 V47 a5 5 0 0 1 5 -5 Z" fill="#fbf8f2" stroke="#221d19" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M19 53 H51" stroke="#221d19" stroke-width="1.8" stroke-linecap="round" opacity=".4"/>
  <!-- copertina con la livrea -->
  <g clip-path="url(#cv)">
    <rect x="12" y="4" width="43" height="44" fill="#c8553d"/>
    <polygon points="34,48 42,48 64,12 56,12" fill="#8fb3a0"/>
    <polygon points="45,48 51,48 70,17 64,17" fill="#1f6f78"/>
  </g>
  <rect x="12" y="4" width="43" height="44" rx="4" fill="none" stroke="#221d19" stroke-width="3.5"/>
  <path d="M19.5 4 V48" stroke="#221d19" stroke-width="2.5"/>
  <!-- Poké Ball sulla copertina -->
  <g transform="translate(34 24)">
    <circle r="11" fill="#fbf8f2" stroke="#221d19" stroke-width="3"/>
    <rect x="-11" y="-1.5" width="22" height="3" fill="#221d19"/>
    <circle r="4" fill="#fbf8f2" stroke="#221d19" stroke-width="2.6"/>
  </g>
</svg>
